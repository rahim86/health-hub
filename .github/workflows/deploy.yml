name: Build and Deploy Family Health App

on:
  push:
    branches: [ "main" ]

# Only one deploy runs at a time; a newer push cancels the in-progress one.
concurrency:
  group: production-deploy-family-health-app
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Build & push image to ghcr.io ────────────────────────────────
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    outputs:
      image: ${{ steps.image.outputs.name }}   # e.g. ghcr.io/rahim86/family-health-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires lowercase image names
      - name: Compute lowercase image name
        id: image
        run: |
          name="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Job 2: SSH into VPS, pull image, and restart container ─────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod

    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # Reads app/Medplum/EHR config from .github/values.yml (committed to
      # this repo). VPS connection details stay in GitHub Secrets/Variables
      # below, not in values.yml.
      - name: Load values.yml
        id: values
        run: |
          {
            echo "app_port=$(yq '.app.port' .github/values.yml)"
            echo "redirect_uri=$(yq '.app.redirect_uri' .github/values.yml)"
            echo "medplum_base_url=$(yq '.medplum.base_url' .github/values.yml)"
            echo "medplum_client_id=$(yq '.medplum.client_id' .github/values.yml)"
            echo "epic_client_id=$(yq '.ehr.epic_client_id' .github/values.yml)"
            echo "oracle_client_id=$(yq '.ehr.oracle_client_id' .github/values.yml)"
            echo "meditech_client_id=$(yq '.ehr.meditech_client_id' .github/values.yml)"
          } >> "$GITHUB_OUTPUT"

          echo "session_secret=$(yq '.app.session_secret' .github/values.yml)" >> "$GITHUB_OUTPUT"
          echo "medplum_client_secret=$(yq '.medplum.client_secret' .github/values.yml)" >> "$GITHUB_OUTPUT"

      - name: Mask secrets in logs
        run: |
          echo "::add-mask::${{ steps.values.outputs.session_secret }}"
          echo "::add-mask::${{ steps.values.outputs.medplum_client_secret }}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR:               ${{ github.actor }}
          IMAGE:                  ${{ env.IMAGE }}
          PORT:                   ${{ steps.values.outputs.app_port }}
          REDIRECT_URI:           ${{ steps.values.outputs.redirect_uri }}
          MEDPLUM_BASE_URL:       ${{ steps.values.outputs.medplum_base_url }}
          MEDPLUM_CLIENT_ID:      ${{ steps.values.outputs.medplum_client_id }}
          MEDPLUM_CLIENT_SECRET:  ${{ steps.values.outputs.medplum_client_secret }}
          EPIC_CLIENT_ID:         ${{ steps.values.outputs.epic_client_id }}
          ORACLE_CLIENT_ID:       ${{ steps.values.outputs.oracle_client_id }}
          MEDITECH_CLIENT_ID:     ${{ steps.values.outputs.meditech_client_id }}
          SESSION_SECRET:         ${{ steps.values.outputs.session_secret }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          envs:     GH_TOKEN,GH_ACTOR,IMAGE,PORT,REDIRECT_URI,MEDPLUM_BASE_URL,MEDPLUM_CLIENT_ID,MEDPLUM_CLIENT_SECRET,EPIC_CLIENT_ID,ORACLE_CLIENT_ID,MEDITECH_CLIENT_ID,SESSION_SECRET
          script: |
            set -e

            echo "Resolved values -> IMAGE=$IMAGE PORT=$PORT MEDPLUM_BASE_URL=$MEDPLUM_BASE_URL REDIRECT_URI=$REDIRECT_URI"

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker pull "$IMAGE"

            docker stop family-health-app 2>/dev/null || true
            docker rm   family-health-app 2>/dev/null || true

            docker run -d \
              --name family-health-app \
              --restart unless-stopped \
              -p "$PORT":"$PORT" \
              -e NODE_ENV=production \
              -e PORT="$PORT" \
              -e REDIRECT_URI="$REDIRECT_URI" \
              -e MEDPLUM_BASE_URL="$MEDPLUM_BASE_URL" \
              -e MEDPLUM_CLIENT_ID="$MEDPLUM_CLIENT_ID" \
              -e MEDPLUM_CLIENT_SECRET="$MEDPLUM_CLIENT_SECRET" \
              -e EPIC_CLIENT_ID="$EPIC_CLIENT_ID" \
              -e ORACLE_CLIENT_ID="$ORACLE_CLIENT_ID" \
              -e MEDITECH_CLIENT_ID="$MEDITECH_CLIENT_ID" \
              -e SESSION_SECRET="$SESSION_SECRET" \
              "$IMAGE"

            docker image prune -f
            echo "Deployed $IMAGE successfully."

      - name: Health check
        uses: appleboy/ssh-action@v1
        env:
          PORT: ${{ steps.values.outputs.app_port }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          envs:     PORT
          script: |
            sleep 5
            curl -sf http://localhost:"$PORT"/health && echo "Health check passed" || (echo "Health check failed"; docker logs family-health-app --tail 30; exit 1)
